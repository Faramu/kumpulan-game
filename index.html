<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Game Menu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <!-- Background Elements -->
        <div class="clouds"></div>
        <div class="trees">
            <div class="tree">
                <div class="tree-leaves"></div>
                <div class="tree-trunk"></div>
            </div>
            <div class="tree" style="transform: scale(0.8); transform-origin: bottom;">
                <div class="tree-leaves"></div>
                <div class="tree-trunk"></div>
            </div>
            <div class="tree" style="transform: scale(1.1); transform-origin: bottom;">
                <div class="tree-leaves"></div>
                <div class="tree-trunk"></div>
            </div>
        </div>
        
        <!-- Main Menu -->
        <div class="menu" id="stage-menu">
            <button onclick="showStage(1)" class="pixel-btn">STAGE 1</button>
            <button onclick="showStage(2)" class="pixel-btn">STAGE 2</button>
            <button onclick="showStage(3)" class="pixel-btn">STAGE 3</button>
            <button onclick="showStage(4)" class="pixel-btn">STAGE 4</button>
            <button onclick="showStage(5)" class="pixel-btn">STAGE 5</button>
            <button onclick="showStage(6)" class="pixel-btn">STAGE 6</button>
        </div>

        <!-- Level Menu (Hidden by default) -->
        <div class="menu" id="level-menu" style="display: none;">
            <div id="stage-title" style="color: #fb9e31; text-align: center; margin-bottom: 20px; text-shadow: 2px 2px 0px #211108, -2px -2px 0px #211108, 2px -2px 0px #211108, -2px 2px 0px #211108; font-size: 24px;">STAGE X</div>
            <a href="#" id="lvl-1-btn" class="pixel-btn">LEVEL 1</a>
            <a href="#" id="lvl-2-btn" class="pixel-btn">LEVEL 2</a>
            <a href="#" id="lvl-3-btn" class="pixel-btn">LEVEL 3</a>
            <button onclick="goBack()" class="pixel-btn" style="background-color: #a43030; color: #fff;">BACK</button>
        </div>

        <div class="ground-wrapper">
            <div class="grass"></div>
            <div class="dirt"></div>
        </div>
        
        <div class="signpost">
            <div class="sign-board"><span class="arrow">➔</span></div>
            <div class="sign-pole"></div>
            <div class="stones">
                <div class="stone stone1"></div>
                <div class="stone stone2"></div>
            </div>
        </div>
    </div>
    <script>
        const stageLevels = [
            ['Eksplorasi', 'Tebing Kabut', 'Garis Bilangan'],
            ['Pengenalan Pasar', 'Hitung Penjual Buah', 'Evaluasi Pasar'],
            ['Pengatur Suhu', 'Suhu Lanjutan', 'Suhu Campuran'],
            ['Pemecah Dinding', 'Soal Obor', 'Energi Penghancur'],
            ['Konsep FPB', 'Pohon Faktor', 'Benteng Utama'],
            ['Gembok Gerbang', 'Tembus Perisai', 'Final Boss']
        ];

        function showStage(stageNum) {
            document.getElementById('stage-menu').style.display = 'none';
            document.getElementById('level-menu').style.display = 'flex';
            
            document.getElementById('stage-title').innerText = 'STAGE ' + stageNum;
            
            // Set nama level sesuai stage
            let levelNames = stageLevels[stageNum - 1];
            document.getElementById('lvl-1-btn').innerText = levelNames[0];
            document.getElementById('lvl-2-btn').innerText = levelNames[1];
            document.getElementById('lvl-3-btn').innerText = levelNames[2];
            
            // Rumus: Folder Level dimulai dari = (Stage - 1) * 3 + 1
            let startFolderIndex = (stageNum - 1) * 3 + 1;
            
            document.getElementById('lvl-1-btn').href = 'level_' + startFolderIndex + '/';
            document.getElementById('lvl-2-btn').href = 'level_' + (startFolderIndex + 1) + '/';
            document.getElementById('lvl-3-btn').href = 'level_' + (startFolderIndex + 2) + '/';
        }

        function goBack() {
            document.getElementById('stage-menu').style.display = 'flex';
            document.getElementById('level-menu').style.display = 'none';
        }
    </script>
</body>
</html>
