<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Game Menu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <!-- Background Elements -->
        <div class="clouds"></div>
        <div class="trees">
            <div class="tree">
                <div class="tree-leaves"></div>
                <div class="tree-trunk"></div>
            </div>
            <div class="tree" style="transform: scale(0.8); transform-origin: bottom;">
                <div class="tree-leaves"></div>
                <div class="tree-trunk"></div>
            </div>
            <div class="tree" style="transform: scale(1.1); transform-origin: bottom;">
                <div class="tree-leaves"></div>
                <div class="tree-trunk"></div>
            </div>
        </div>
        
        <!-- Main Menu -->
        <div class="menu">
            <a href="level_1/" class="pixel-btn">LEVEL 1</a>
            <a href="level_2/" class="pixel-btn">LEVEL 2</a>
            <a href="level_3/" class="pixel-btn">LEVEL 3</a>
            <a href="level_4/" class="pixel-btn">LEVEL 4</a>
            <a href="level_5/" class="pixel-btn">LEVEL 5</a>
            <a href="level_6/" class="pixel-btn">LEVEL 6</a>
        </div>

        <div class="ground-wrapper">
            <div class="grass"></div>
            <div class="dirt"></div>
        </div>
        
        <div class="signpost">
            <div class="sign-board"><span class="arrow">➔</span></div>
            <div class="sign-pole"></div>
            <div class="stones">
                <div class="stone stone1"></div>
                <div class="stone stone2"></div>
            </div>
        </div>
    </div>
</body>
</html>
